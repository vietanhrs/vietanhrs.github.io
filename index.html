    <script>
      try {
        const saved = localStorage.getItem("vietanh-portfolio-theme");
        const theme =
          saved === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : saved === "light"
              ? "light"
              : "dark";
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
    <meta name="author" content="anh.tv" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          const redirect = sessionStorage.getItem("spa-redirect");
          if (!redirect) return;
          sessionStorage.removeItem("spa-redirect");
          const target = new URL(redirect, window.location.origin);
          if (target.origin !== window.location.origin || target.pathname === "/404.html") return;
          window.history.replaceState(null, "", `${target.pathname}${target.search}${target.hash}`);
        } catch {
          // Storage or an invalid saved URL must never prevent the home page loading.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
